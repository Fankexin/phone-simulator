<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<g clip-path="url(#clip-clock-face)">
<rect width="60" height="60" fill="url(#pattern-clock-face)"/>
</g>
<defs>
<pattern id="pattern-clock-face" patternContentUnits="objectBoundingBox" width="1" height="1">
<use xlink:href="#image-clock-face" transform="scale(0.00555556)"/>
</pattern>
<clipPath id="clip-clock-face">
<rect width="60" height="60" rx="14" fill="white"/>
</clipPath>
<image id="image-clock-face" width="180" height="180" preserveAspectRatio="none" xlink:href="data:image/png;base64,"/>
</defs>
</svg>
